<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | DespachoDigital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9851358855551100"
     crossorigin="anonymous"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); line-height: 1.7; }
        
        .navbar { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1000px; margin: 0 auto; padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: 800; color: #0f172a; text-decoration: none; letter-spacing: -0.03em; }
        .logo span { color: var(--primary); }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; margin-left: 1.5rem; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }

        .main-container { max-width: 600px; margin: 4rem auto; padding: 0 1.5rem; }
        .contact-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 24px; padding: 3rem; box-shadow: var(--shadow); }
        
        .contact-box h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.5rem; }
        .contact-box p { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }

        /* Estilos del Formulario */
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 0.5rem; color: #334155; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 1rem; color: var(--text-main); transition: border-color 0.2s; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
        
        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 0.85rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background-color 0.2s; margin-top: 0.5rem; }
        .btn-submit:hover { background: var(--primary-hover); }

        .footer { background-color: #ffffff; border-top: 1px solid var(--border); text-align: center; padding: 2.5rem; margin-top: 6rem; font-size: 0.95rem; color: var(--text-muted); font-weight: 500; }
        .footer-links { margin-top: 0.75rem; }
        .footer-links a { color: var(--primary); text-decoration: none; margin: 0 0.5rem; font-weight: 600; }

        @media (max-width: 600px) {
            .contact-box { padding: 2rem 1.5rem; border-radius: 16px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Despacho<span>Digital</span></a>
            <div class="nav-links">
                <a href="index.html">Comparativas</a>
                <a href="guias.html">Guías</a>
                <a href="contacto.html" class="active">Contacto</a>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="contact-box">
            <h1>Contacta con Nosotros</h1>
            <p>¿Tienes dudas sobre algún software o quieres proponer una herramienta para que la analicemos? Escríbenos.</p>
            
            <form action="#" method="POST" onsubmit="event.preventDefault(); alert('¡Mensaje simulado correctamente!');">
                <div class="form-group">
                    <label for="nombre">Nombre profesional o Despacho</label>
                    <input type="text" id="nombre" placeholder="Ej. Gestión Fincas Martínez" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@dominio.com" required>
                </div>
                
                <div class="form-group">
                    <label for="mensaje">Tu Consulta</label>
                    <textarea id="mensaje" rows="5" placeholder="Cuéntanos en qué podemos ayudarte..." required></textarea>
                </div>
                
                <button type="submit" class="btn-submit">Enviar Mensaje</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 DespachoDigital. Todos los derechos reservados.</p>
        <div class="footer-links">
            <a href="#">Aviso Legal</a> | <a href="#">Política de Privacidad</a> | <a href="contacto.html">Contacto</a>
        </div>
    </footer>

</body>
</html>
